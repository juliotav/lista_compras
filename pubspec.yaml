name: lista_compras
description: "Lista de Compras"
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  http: ^1.3.0
  mongo_dart: ^0.10.3
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/app_icon.png
